; NFSRef settings.  Must be kept the SAME as the port's automated test run
; (AUTOSEQ / DUMPFRAME / QUITFRAMES / MOUSEAT / NOMOVIES).
[nfsref]
; frame:DIK-code[:duration]  (0x1C = Enter)  from the menus to Quick Race / Resort Loop
autoseq=1000:0x1C,1350:0x1C,1700:0x1C,2050:0x1C,2400:0x1C,2750:0x1C,3100:0x1C,3700:0x1C,4000:0x1C
; frames whose back buffer is saved as BMP
frames=1300,1650,2000,2350,2700,3050,5000,5300,5600,5800,6200,6500,6800,7100,7400,7700,8000,8300,8600,8900
; frames in which all D3D calls are dumped
dump=1650,3050,5800,8900
; the game closes itself at this frame
exit=8950
mouse_x=5
mouse_y=5
no_video=1
; lock the game to real 60 fps (like PACE60 in the port test)
pace60=1
; catch Present at the function entry (even if the vtable is bypassed)
hotpatch=1
; the game closes itself after this many seconds (safety)
time_limit=420
; in dump frames: texture content hashes, images of target textures (reflection cube map etc.)
tex_summary=1
target_tex=1
; shader bytecode (shaders\ folder)
shader_dump=1
; DirectSound recording (sound_log.txt + sound_data.bin), data limit in MB
sound=1
sound_limit_mb=150
; troubleshooting: set to 0 to turn hook groups off one by one
clock=1
input=1
registry=1
files=1
